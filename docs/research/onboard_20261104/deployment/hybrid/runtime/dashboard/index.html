<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>机器人现场观察</title><link rel="stylesheet" href="dashboard.css"></head>
<body>
<header><div><span class="eyebrow">现场观察</span><h1>机器人空间视图</h1></div><div class="connection"><span id="connection-dot"></span><span id="connection">正在连接</span><span id="updated">—</span></div></header>
<main>
<section class="panel camera-panel"><div class="panel-head"><div><h2>实时相机</h2><p id="camera-meta">等待实际画面</p></div><span class="badge">现场 RGB</span></div><div class="camera-content"><img id="camera" alt="机器人实际相机画面" hidden><div class="empty" id="camera-empty">正在等待相机数据</div></div></section>
<section class="panel map-panel"><div class="panel-head"><div><h2>二维地图与轨迹</h2><p id="map-meta">等待地图</p></div><div class="map-buttons"><button id="map-reset" type="button">回到小车</button> <button id="map-full" type="button">全图</button></div></div><div class="canvas-wrap"><canvas id="map" aria-label="实际占据地图、轨迹与机器人位置"></canvas><div class="empty" id="map-empty">正在等待地图数据</div></div><footer><div class="legend"><span><i class="free"></i>空闲</span><span><i class="occupied"></i>占据</span><span><i class="unknown"></i>未知</span><span><i class="track"></i>轨迹</span></div><span>北向朝上 · 拖动平移 · 滚轮缩放</span></footer></section>
<section class="panel cloud-panel"><div class="panel-head"><div><h2>三维重建</h2><p id="cloud-meta">等待实际点云</p></div><button id="cloud-reset" type="button">复位视角</button></div><div class="canvas-wrap"><canvas id="cloud" aria-label="可旋转的实际三维彩色点云"></canvas><div class="empty" id="cloud-empty">正在等待三维数据</div><div class="accuracy">重建精度未标定</div></div><footer><span id="cloud-status">—</span><span>拖动旋转 · 滚轮缩放</span></footer></section>
</main><div class="notice" id="notice">仅展示实时传感数据，不发送运动指令。</div>
<script src="dashboard.js"></script></body></html>
