# colleague_nav_geometry_v1: imported user-selected colleague footprint, padding and inflation.
latch_xy_goal_tolerance: true
recovery_behavior_enabled: true
clearing_rotation_allowed: false
recovery_behaviors:
- name: clear_local_obstacles
  type: clear_costmap_recovery/ClearCostmapRecovery
make_plan_clear_costmap: false
make_plan_add_unreachable_goal: false
NavfnROS:
  allow_unknown: true
  default_tolerance: 0.0
global_costmap:
  footprint: &id001
  - - -0.28
    - -0.22
  - - 0.28
    - -0.22
  - - 0.28
    - 0.22
  - - -0.28
    - 0.22
  footprint_padding: 0.02
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  rolling_window: true
  resolution: 0.05
  track_unknown_space: true
  always_send_full_costmap: true
  plugins:
  - name: static_layer
    type: costmap_2d::StaticLayer
  - name: obstacle_layer
    type: costmap_2d::ObstacleLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  static_layer:
    map_topic: /nso_visual/map
    subscribe_to_updates: true
    track_unknown_space: true
  obstacle_layer:
    observation_sources: laser depth_scan
    track_unknown_space: true
    depth_scan:
      topic: /nso_visual/scan
      data_type: LaserScan
      marking: true
      clearing: false
      obstacle_range: 3.0
      raytrace_range: 3.5
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      observation_persistence: 0.0
      expected_update_rate: 0.5
      inf_is_valid: false
    laser:
      topic: /scan
      data_type: LaserScan
      sensor_frame: laser_link
      marking: true
      clearing: true
      obstacle_range: 3.0
      raytrace_range: 3.5
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      observation_persistence: 0.0
      expected_update_rate: 0.5
      inf_is_valid: false
  inflation_layer:
    inflation_radius: 0.25
    cost_scaling_factor: 8.0
  width: 8.0
  height: 8.0
local_costmap:
  footprint: *id001
  footprint_padding: 0.02
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  rolling_window: true
  resolution: 0.05
  track_unknown_space: false
  always_send_full_costmap: true
  width: 5.0
  height: 5.0
  plugins:
  - name: obstacle_layer
    type: costmap_2d::ObstacleLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  obstacle_layer:
    observation_sources: laser depth_scan
    track_unknown_space: false
    depth_scan:
      topic: /nso_visual/scan
      data_type: LaserScan
      marking: true
      clearing: false
      obstacle_range: 3.0
      raytrace_range: 3.5
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      observation_persistence: 0.0
      expected_update_rate: 0.5
      inf_is_valid: false
    laser:
      topic: /scan
      data_type: LaserScan
      sensor_frame: laser_link
      marking: true
      clearing: true
      obstacle_range: 3.0
      raytrace_range: 3.5
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      observation_persistence: 0.0
      expected_update_rate: 0.5
      inf_is_valid: false
  inflation_layer:
    inflation_radius: 0.25
    cost_scaling_factor: 8.0
oscillation_timeout: 30.0
oscillation_distance: 0.05
DWAPlannerROS:
  max_vel_x: 0.05
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.05
  min_vel_trans: 0.02
  max_vel_theta: 0.3
  min_vel_theta: 0.05
  acc_lim_x: 0.25
  acc_lim_y: 0.25
  acc_lim_theta: 0.8
  acc_lim_trans: 0.25
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.08
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.01
  theta_stopped_vel: 0.03
  prune_plan: true
  use_dwa: true
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.2
  sim_time: 1.7
  sim_granularity: 0.025
  angular_sim_granularity: 0.01
  path_distance_bias: 0.6
  goal_distance_bias: 0.8
  occdist_scale: 0.01
  twirling_scale: 0.0
  stop_time_buffer: 0.2
  forward_point_distance: 0.325
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  vx_samples: 10
  vy_samples: 1
  vth_samples: 20
  publish_traj_pc: false
  publish_cost_grid_pc: false
  odom_topic: /nso_visual/odom
base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 10.0
planner_frequency: 1.0
controller_patience: 5.0
planner_patience: 8.0
shutdown_costmaps: false
navigation_source: lidar_rgbd
clear_local_obstacles:
  reset_distance: 0.0
  layer_names:
  - obstacle_layer
  affected_maps: local
  force_updating: true
