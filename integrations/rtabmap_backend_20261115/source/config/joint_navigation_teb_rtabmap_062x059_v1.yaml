# Optional RTAB optimized-map frame; original geometry, collision and velocity parameters preserved.
latch_xy_goal_tolerance: true
recovery_behavior_enabled: true
clearing_rotation_allowed: false
recovery_behaviors:
- name: clear_local_obstacles
  type: clear_costmap_recovery/ClearCostmapRecovery
make_plan_clear_costmap: false
make_plan_add_unreachable_goal: false
NavfnROS:
  allow_unknown: true
  default_tolerance: 0.0
global_costmap:
  footprint: &id001
  - - -0.31
    - -0.295
  - - 0.31
    - -0.295
  - - 0.31
    - 0.295
  - - -0.31
    - 0.295
  footprint_padding: 0.0
  global_frame: nso_pair_map
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  rolling_window: true
  resolution: 0.05
  track_unknown_space: true
  always_send_full_costmap: true
  plugins:
  - name: static_layer
    type: costmap_2d::StaticLayer
  - name: obstacle_layer
    type: costmap_2d::ObstacleLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  static_layer:
    map_topic: /nso_pair/map
    subscribe_to_updates: true
    track_unknown_space: true
  obstacle_layer:
    observation_sources: laser depth_scan
    track_unknown_space: true
    depth_scan:
      topic: /nso_visual/scan
      data_type: LaserScan
      marking: true
      clearing: false
      obstacle_range: 3.0
      raytrace_range: 3.5
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      observation_persistence: 0.0
      expected_update_rate: 0.5
      inf_is_valid: false
    laser:
      topic: /nso_scan/self_filtered
      data_type: LaserScan
      sensor_frame: laser_link
      marking: true
      clearing: true
      obstacle_range: 3.0
      raytrace_range: 3.5
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      observation_persistence: 0.0
      expected_update_rate: 0.5
      inf_is_valid: false
    combination_method: 0
  inflation_layer:
    inflation_radius: 0.55
    cost_scaling_factor: 5.0
  width: 40.0
  height: 40.0
local_costmap:
  footprint: *id001
  footprint_padding: 0.0
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  rolling_window: true
  resolution: 0.05
  track_unknown_space: false
  always_send_full_costmap: true
  width: 5.0
  height: 5.0
  plugins:
  - name: obstacle_layer
    type: costmap_2d::ObstacleLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  obstacle_layer:
    observation_sources: laser depth_scan
    track_unknown_space: false
    depth_scan:
      topic: /nso_visual/scan
      data_type: LaserScan
      marking: true
      clearing: false
      obstacle_range: 3.0
      raytrace_range: 3.5
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      observation_persistence: 0.0
      expected_update_rate: 0.5
      inf_is_valid: false
    laser:
      topic: /nso_scan/self_filtered
      data_type: LaserScan
      sensor_frame: laser_link
      marking: true
      clearing: true
      obstacle_range: 3.0
      raytrace_range: 3.5
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      observation_persistence: 0.0
      expected_update_rate: 0.5
      inf_is_valid: false
  inflation_layer:
    inflation_radius: 0.55
    cost_scaling_factor: 5.0
oscillation_timeout: 30.0
oscillation_distance: 0.05
DWAPlannerROS:
  max_vel_x: 0.05
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.05
  min_vel_trans: 0.02
  max_vel_theta: 0.3
  min_vel_theta: 0.05
  acc_lim_x: 0.25
  acc_lim_y: 0.25
  acc_lim_theta: 0.8
  acc_lim_trans: 0.25
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.08
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.01
  theta_stopped_vel: 0.03
  prune_plan: true
  use_dwa: true
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.2
  sim_time: 4.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.01
  path_distance_bias: 0.6
  goal_distance_bias: 0.8
  occdist_scale: 0.01
  twirling_scale: 0.0
  stop_time_buffer: 0.2
  forward_point_distance: 0.325
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  vx_samples: 10
  vy_samples: 1
  vth_samples: 20
  publish_traj_pc: false
  publish_cost_grid_pc: false
  odom_topic: /nso_visual/odom
base_global_planner: nso_global_planner/GlobalPlanner
base_local_planner: teb_local_planner/TebLocalPlannerROS
controller_frequency: 10.0
planner_frequency: 1.0
controller_patience: 5.0
planner_patience: 8.0
shutdown_costmaps: false
navigation_source: lidar_rgbd
clear_local_obstacles:
  reset_distance: 0.0
  layer_names:
  - obstacle_layer
  affected_maps: local
  force_updating: true
navigation_fusion_profile: shared_global_overwrite_local_original_v1
GlobalPlanner:
  allow_unknown: true
  default_tolerance: 0.0
  use_dijkstra: true
  use_grid_path: true
  use_quadratic: true
  old_navfn_behavior: true
  lethal_cost: 254
  neutral_cost: 50
  cost_factor: 0.8
  orientation_mode: 0
  publish_potential: false
TebLocalPlannerROS:
  odom_topic: /nso_csm/control_odom
  map_frame: odom
  max_vel_x: 0.05
  max_vel_x_backwards: 0.05
  max_vel_y: 0.0
  max_vel_theta: 0.2
  acc_lim_x: 0.25
  acc_lim_y: 0.25
  acc_lim_theta: 0.8
  min_turning_radius: 0.0
  cmd_angle_instead_rotvel: false
  footprint_model:
    type: polygon
    vertices: *id001
  is_footprint_dynamic: false
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.35
  free_goal_vel: false
  complete_global_plan: true
  max_global_plan_lookahead_dist: 1.5
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: true
  dt_ref: 1.0
  dt_hysteresis: 0.1
  min_samples: 3
  max_samples: 50
  feasibility_check_no_poses: 50
  min_obstacle_dist: 0.05
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 4.0
  costmap_converter_plugin: ''
  enable_homotopy_class_planning: false
  enable_multithreading: false
  weight_kinematics_forward_drive: 1.0
  min_resolution_collision_check_angular: 0.05
  penalty_epsilon: 0.005
